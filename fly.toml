# Máy chủ phòng chơi trên Fly.io, vùng Singapore (gần Việt Nam nhất).
# Một máy duy nhất (phòng giữ trong bộ nhớ); tự tắt khi không ai chơi, tự bật khi có người kết nối.
app = "dtk-arena-sin"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
