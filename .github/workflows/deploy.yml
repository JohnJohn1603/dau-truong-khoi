# Mỗi lần push lên main:
#  1. kiểm tra kiểu và chạy trận mô phỏng (có phòng 5 người)
#  2. build trang game và đăng lên GitHub Pages, gắn sẵn địa chỉ máy chủ lấy từ biến repo SERVER_URL
#     (Settings → Secrets and variables → Actions → Variables, ví dụ wss://dtk-arena.onrender.com)
# Máy chủ phòng: Render tự triển khai theo render.yaml; hoặc Oracle Always Free (deploy/oracle). Xem README.
name: Triển khai
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  check:
    name: Kiểm tra lõi và máy chủ
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run sim

  pages:
    name: Trang game lên GitHub Pages
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run build
        env:
          VITE_SERVER_URL: ${{ vars.SERVER_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: client/dist }
      - id: deploy
        uses: actions/deploy-pages@v4
